name: sydney
description: Mobile-first AI delegation messaging app frontend.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  flutter_secure_storage: ^10.3.1
  flutter_web_auth_2: ^5.0.2
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  cupertino_icons: ^1.0.8
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  file_picker: ^8.1.7
  flutter_timezone: ^5.1.0
  camera: ^0.12.0+2
  image_picker: ^1.2.3
  photo_manager: ^3.10.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/icons/
