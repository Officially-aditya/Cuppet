<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuppet Preference Signals</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 32px; max-width: 600px; color: #1c1a17; background: #f7f6f0; }
      main { padding: 24px; border: 1px solid #d9d8ce; border-radius: 16px; background: #fff; }
      label { display: block; margin-top: 16px; font-weight: 700; }
      input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px; border: 1px solid #b9b8ad; border-radius: 8px; }
      button { margin-top: 20px; padding: 10px 16px; border: 0; border-radius: 8px; color: #fff; background: #356859; cursor: pointer; }
      #status { min-height: 1.4em; margin-top: 12px; color: #356859; }
      .privacy { color: #67665e; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Cuppet Preference Signals</h1>
      <p class="privacy">This extension is disabled until you add a connection token. When enabled, it sends only the public domain of an active tab. It never sends page URLs, titles, page text, form fields, or browsing history.</p>
      <label for="apiBaseUrl">Cuppet API URL</label>
      <input id="apiBaseUrl" type="url" placeholder="https://connect.cuppet.in">
      <label for="browserToken">Browser connection token</label>
      <input id="browserToken" type="password" autocomplete="off" spellcheck="false">
      <button id="save" type="button">Save connection</button>
      <div id="status" role="status"></div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
