  <g id="cuppet-preview-conductor">
    <rect x="48" y="150" width="1104" height="146" rx="24" fill="#FCFBFA" stroke="#D4D9D2" stroke-width="2"/>
    <g transform="translate(76 159)">
      <path d="M111 31 A49 49 0 1 0 111 113"
            fill="none"
            stroke="#006046"
            stroke-width="19"
            stroke-linecap="round"/>
      <path d="M76 72 112 40 M76 72h47 M76 72l36 32"
            fill="none"
            stroke="#3F7D57"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"/>
      <circle cx="76" cy="72" r="10" fill="#006046"/>
      <circle cx="115" cy="38" r="9" fill="#D9A441"/>
      <circle cx="125" cy="72" r="9" fill="#3F7D57"/>
      <circle cx="115" cy="106" r="9" fill="#D9A441"/>
      <text x="158" y="98"
            fill="#17201C"
            font-family="'Avenir Next', Avenir, Arial, sans-serif"
            font-size="72"
            font-weight="700"
            letter-spacing="-3">Cuppet</text>
    </g>
    <text x="740" y="208"
          fill="#006046"
          font-family="'Avenir Next', Avenir, Arial, sans-serif"
          font-size="19"
          font-weight="700"
          letter-spacing="1.2">01 · CONDUCTOR</text>
    <text x="740" y="241"
          fill="#706E6A"
          font-family="'Avenir Next', Avenir, Arial, sans-serif"
          font-size="17">One workspace coordinating many agents</text>
  </g>

