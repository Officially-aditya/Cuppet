    <rect x="48" y="320" width="1104" height="146" rx="24" fill="#FCFBFA" stroke="#D4D9D2" stroke-width="2"/>
    <g transform="translate(84 329)">
      <path d="M17 48 46 18c4-4 8-4 13-1l24 14-31 31Z" fill="url(#cuppet-preview-loom-teal)"/>
      <path d="m79 29 32 20c5 3 6 8 4 13L101 91 67 57Z" fill="url(#cuppet-preview-loom-coral)"/>
      <path d="m101 86-28 27c-4 4-9 4-13 1L34 98l34-34Z" fill="url(#cuppet-preview-loom-amber)"/>
      <path d="M38 101 16 76c-3-4-4-8-1-13l15-27 35 34Z" fill="url(#cuppet-preview-loom-indigo)"/>
      <path d="m17 48 13-12 35 34-13 13Z" fill="#1F2858" opacity=".42"/>
      <path d="m79 29 4 2-31 31-8-8Z" fill="#F5F3EE" opacity=".2"/>
      <path d="m101 86-33-22 8-8 31 24Z" fill="#9F3F56" opacity=".34"/>
      <path d="M38 101 68 64l8 8-28 35Z" fill="#B76A35" opacity=".38"/>
      <rect x="49" y="49" width="30" height="30" rx="8" fill="#F5F3EE" transform="rotate(45 64 64)"/>
      <circle cx="64" cy="64" r="5" fill="#17201C"/>
      <text x="150" y="98"
            fill="#17201C"
            font-family="'Avenir Next', Avenir, Arial, sans-serif"
            font-size="72"
            font-weight="700"
            letter-spacing="-3">Cuppet</text>
    </g>
    <text x="740" y="378"
          fill="#006046"
          font-family="'Avenir Next', Avenir, Arial, sans-serif"
          font-size="19"
          font-weight="700"
          letter-spacing="1.2">02 · HANDOFF LOOM</text>
    <text x="740" y="411"
          fill="#706E6A"
          font-family="'Avenir Next', Avenir, Arial, sans-serif"
          font-size="17">Colorful workstreams woven around a finished result</text>
  </g>

  <g id="cuppet-preview-courier">
    <rect x="48" y="490" width="1104" height="146" rx="24" fill="#FCFBFA" stroke="#D4D9D2" stroke-width="2"/>
    <g transform="translate(84 499)">
      <path d="m13 47 35 9-7 16-28-8 17-7Z" fill="#55508F"/>
      <path d="m13 88 28-16 8 8-26 21 7-18Z" fill="#E56B61"/>
      <path d="m47 57-10-44 42 26Z" fill="url(#cuppet-preview-courier-coral)"/>
      <path d="m41 71-12 43 44-31Z" fill="url(#cuppet-preview-courier-teal)"/>
      <path d="m45 56 34-18 31 24-38 22-31-13Z" fill="url(#cuppet-preview-courier-indigo)"/>
      <path d="m45 56 34-18-7 46-31-13Z" fill="#F5F3EE"/>
      <path d="m79 38 25 9 9 14-5 7-18-9Z" fill="url(#cuppet-preview-courier-amber)"/>
      <path d="m108 55 17 7-18 6Z" fill="#F58A73"/>
      <path d="m72 84 18-25 18 9Z" fill="#3F356D" opacity=".65"/>
      <circle cx="101" cy="53" r="3" fill="#17201C"/>
      <text x="150" y="98"
            fill="#17201C"
            font-family="'Avenir Next', Avenir, Arial, sans-serif"
            font-size="72"
            font-weight="700"
            letter-spacing="-3">Cuppet</text>
    </g>
    <text x="740" y="548"
          fill="#006046"
          font-family="'Avenir Next', Avenir, Arial, sans-serif"
          font-size="19"
          font-weight="700"
          letter-spacing="1.2">03 · COURIER</text>
    <text x="740" y="581"
          fill="#706E6A"
          font-family="'Avenir Next', Avenir, Arial, sans-serif"
          font-size="17">A distinctive messenger that carries delegated work</text>
  </g>
</svg>
