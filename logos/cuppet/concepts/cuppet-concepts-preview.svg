<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 690"
     role="img"
     aria-labelledby="cuppet-concepts-preview-title cuppet-concepts-preview-desc">
  <title id="cuppet-concepts-preview-title">Three Cuppet logo concepts</title>
  <desc id="cuppet-concepts-preview-desc">A comparison board showing Conductor, Handoff Loom, and Courier logo directions for Cuppet.</desc>
  <defs>
    <linearGradient id="cuppet-preview-loom-teal" x1="18" y1="18" x2="70" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20A092"/>
      <stop offset="1" stop-color="#075E59"/>
    </linearGradient>
    <linearGradient id="cuppet-preview-loom-coral" x1="72" y1="24" x2="108" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F58A73"/>
      <stop offset="1" stop-color="#BE4E60"/>
    </linearGradient>
    <linearGradient id="cuppet-preview-loom-amber" x1="106" y1="78" x2="56" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4C66D"/>
      <stop offset="1" stop-color="#D68632"/>
    </linearGradient>
    <linearGradient id="cuppet-preview-loom-indigo" x1="50" y1="110" x2="18" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55508F"/>
      <stop offset="1" stop-color="#29264F"/>
    </linearGradient>
    <linearGradient id="cuppet-preview-courier-coral" x1="37" y1="13" x2="76" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A7F"/>
      <stop offset="1" stop-color="#C94F66"/>
    </linearGradient>
    <linearGradient id="cuppet-preview-courier-indigo" x1="38" y1="52" x2="109" y2="81" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5D579D"/>
      <stop offset="1" stop-color="#29264F"/>
    </linearGradient>
    <linearGradient id="cuppet-preview-courier-teal" x1="30" y1="110" x2="75" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B625B"/>
      <stop offset="1" stop-color="#2BA898"/>
    </linearGradient>
    <linearGradient id="cuppet-preview-courier-amber" x1="78" y1="38" x2="112" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4C66D"/>
      <stop offset="1" stop-color="#DB8833"/>
    </linearGradient>
  </defs>
  <rect id="cuppet-preview-background" width="1200" height="690" rx="32" fill="#F5F3EE"/>
  <text x="64" y="74"
