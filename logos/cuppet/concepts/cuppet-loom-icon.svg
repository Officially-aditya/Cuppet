<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128"
     role="img"
     aria-labelledby="cuppet-loom-icon-title cuppet-loom-icon-desc">
  <title id="cuppet-loom-icon-title">Cuppet Handoff Loom icon</title>
  <desc id="cuppet-loom-icon-desc">Four shaded geometric ribbons weave around a warm ivory result tile.</desc>
  <defs>
    <linearGradient id="cuppet-loom-icon-teal" x1="18" y1="18" x2="70" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20A092"/>
      <stop offset="1" stop-color="#075E59"/>
    </linearGradient>
    <linearGradient id="cuppet-loom-icon-coral" x1="72" y1="24" x2="108" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F58A73"/>
      <stop offset="1" stop-color="#BE4E60"/>
    </linearGradient>
    <linearGradient id="cuppet-loom-icon-amber" x1="106" y1="78" x2="56" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4C66D"/>
      <stop offset="1" stop-color="#D68632"/>
    </linearGradient>
    <linearGradient id="cuppet-loom-icon-indigo" x1="50" y1="110" x2="18" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55508F"/>
      <stop offset="1" stop-color="#29264F"/>
    </linearGradient>
  </defs>
  <g id="cuppet-loom-icon-ribbons" stroke-linejoin="round">
    <path d="M17 48 46 18c4-4 8-4 13-1l24 14-31 31Z" fill="url(#cuppet-loom-icon-teal)"/>
    <path d="m79 29 32 20c5 3 6 8 4 13L101 91 67 57Z" fill="url(#cuppet-loom-icon-coral)"/>
    <path d="m101 86-28 27c-4 4-9 4-13 1L34 98l34-34Z" fill="url(#cuppet-loom-icon-amber)"/>
    <path d="M38 101 16 76c-3-4-4-8-1-13l15-27 35 34Z" fill="url(#cuppet-loom-icon-indigo)"/>
    <path d="m17 48 13-12 35 34-13 13Z" fill="#1F2858" opacity=".42"/>
    <path d="m79 29 4 2-31 31-8-8Z" fill="#F5F3EE" opacity=".2"/>
    <path d="m101 86-33-22 8-8 31 24Z" fill="#9F3F56" opacity=".34"/>
    <path d="M38 101 68 64l8 8-28 35Z" fill="#B76A35" opacity=".38"/>
